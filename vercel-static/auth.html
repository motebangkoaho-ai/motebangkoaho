<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Login — Motebang Koaho</title>
<meta name="description" content="Private admin login for the Motebang Koaho bookings dashboard." />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css" />
</head>
<body>
<div class="scroll-bg"></div>
<div class="scroll-grid"></div>
<div class="scroll-orb a"></div>
<div class="scroll-orb b"></div>

<nav class="site-nav">
  <a href="index.html" class="logo">Motebang <span>Koaho</span></a>
  <ul class="nav-center" id="navList"><li><a href="index.html">Home</a></li><li><a href="photography.html">Photography</a></li><li><a href="design.html">Design</a></li><li><a href="books.html">Books</a></li><li><a href="about.html">About</a></li><li><a href="booking.html">Book Now</a></li></ul>
  <div class="nav-right">
    <button type="button" class="theme-toggle" aria-label="Toggle theme" id="themeBtn"></button>
    <button type="button" class="mobile-menu-btn" aria-label="Menu" id="menuBtn"><span></span><span></span><span></span></button>
  </div>
</nav>

<main>
<div class="booking-wrap" style="max-width:460px">
  <div class="booking-header">
    <span class="section-label">Private</span>
    <h1 class="section-title">Admin <em>Access</em></h1>
    <p class="section-sub">Sign in to view booking requests.</p>
  </div>
  <form class="booking-form" id="loginForm">
    <div class="form-group"><label for="email">Email</label><input id="email" type="email" value="motebangkoaho@gmail.com" autocomplete="username" required></div>
    <div class="form-group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" required></div>
    <p class="form-error" id="err" hidden></p>
    <button type="submit" class="submit-btn" id="btn">Sign In</button>
  </form>
</div>
</main>

<footer class="site-footer">
  <a href="index.html" class="footer-logo">Motebang <span>Koaho</span></a>
  <span class="footer-copy">© 2026 Motebang Koaho. All rights reserved.</span>
</footer>

<script src="supabase-lite.js"></script>
<script>
if (sb.token()) location.href = 'admin.html';
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.hidden = true;
  btn.disabled = true; btn.textContent = 'Please wait…';
  try {
    await sb.signIn(document.getElementById('email').value, document.getElementById('password').value);
    location.href = 'admin.html';
  } catch (e2) {
    err.textContent = e2.message || 'Sign in failed';
    err.hidden = false;
    btn.disabled = false; btn.textContent = 'Sign In';
  }
});
document.getElementById('themeBtn').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';});
document.getElementById('menuBtn').addEventListener('click',()=>{document.getElementById('navList').classList.toggle('open');});
</script>
</body>
</html>
